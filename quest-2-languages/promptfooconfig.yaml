        "message": "I live in Canada. What do I pay per month for Plus?",
        "lang": "en",
        "case": "P1 Plus to Canada",
        "expect": "31"
      },
      "assert": [
        {
          "type": "llm-rubric",
          "metric": "language",
          "value": "The reply is written in English. Brand and plan names (BeanBox, Starter, Plus, Office), the code WELCOME10 and the email address may stay unchanged."
        },
